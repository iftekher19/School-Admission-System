services:
  postgres:
    image: postgres:16-alpine
    container_name: school-admission-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_admission_db
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_admission_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: